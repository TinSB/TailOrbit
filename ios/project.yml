# XcodeGen 工程描述：在 Mac 上 `xcodegen generate` 生成 TailOrbit.xcodeproj（不进仓库）。编译、装到手机用 mac.sh
name: TailOrbit
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TailOrbit:
    type: application
    platform: iOS
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      - path: TailOrbit
    settings:
      base:
        PRODUCT_NAME: TailOrbit
        INFOPLIST_FILE: TailOrbit/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
